name: Publish Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to repair'
        required: true
        type: string

concurrency:
  group: publish


jobs:
  publish:
    name: Upload release to GitHub Releases
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    environment: publish
    env:
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ env.TAG_NAME }}
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Build package
      run: |
        python -m pip install twine build
        python -m build --wheel --sdist
        python -m twine check dist/*
        ls -la dist
    - name: Create Release and Upload
      id: create_release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Release $TAG_NAME"
        else
          gh release create "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Release $TAG_NAME"
        fi
        gh release upload "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/*
